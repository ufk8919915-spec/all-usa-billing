<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Stripe Checkout</title><link rel="stylesheet" href="/styles.css"></head><body><div class="login"><div class="login-box"><div class="brand"><div class="logo">AU</div><span>All USA Billing</span></div><h2>Secure Mock Checkout</h2><p class="muted">This is a testing-only Stripe checkout simulation. No real card is collected.</p><button class="btn primary" onclick="pay()">Simulate successful payment</button><div id="msg" class="notice" style="margin-top:15px"></div></div></div><script>async function pay(){const q=new URLSearchParams(location.search),claimId=q.get('claimId');const r=await fetch('/api/stripe/mock-webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({claimId})});const j=await r.json();document.getElementById('msg').textContent=j.received?'Payment successful. You can return to All USA Billing.':'Payment failed: '+(j.error||'Unknown error');}</script></body></html>
